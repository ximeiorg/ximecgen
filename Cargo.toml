[workspace]
resolver = "2"
members = ["crates/xime-config-core"]

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.2"
thiserror = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
