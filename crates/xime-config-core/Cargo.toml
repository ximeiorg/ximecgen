[package]
name = "xime-config-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Xime config visual editor core library - shared between Android (JNI) and Web (WASM)"

# wasm-opt 需要从 GitHub 下载 binaryen，离线/受限网络环境构建会失败；体积影响可接受
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, features = [
    "invocation",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
